<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanjirul Pay & Mine</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #070913;
            --card-bg: linear-gradient(135deg, #131b2e, #0b111e);
            --accent-gold: #facc15;
            --accent-blue: #38bdf8;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 90px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 15px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .profile-badge {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #facc15, #ca8a04);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #000;
            border: 2px solid #facc15;
        }
        .balance-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 1px solid rgba(250, 204, 21, 0.3);
            margin-bottom: 15px;
        }
        .balance-amount {
            font-size: 34px;
            font-weight: bold;
            color: var(--accent-gold);
            margin: 8px 0;
            text-shadow: 0 0 15px rgba(250, 204, 21, 0.4);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .menu-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 15px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .menu-card:active {
            transform: scale(0.95);
        }
        .menu-icon {
            font-size: 24px;
            margin-bottom: 6px;
        }
        .menu-title {
            font-size: 12px;
            font-weight: 600;
        }
        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .btn-gold {
            background: linear-gradient(135deg, #facc15, #ca8a04);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(250, 204, 21, 0.3);
        }
        .btn-sm {
            background: var(--accent-blue);
            color: #070913;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-sm:disabled {
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
        }
        .streak-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .streak-box {
            background: #111827;
            border-radius: 10px;
            padding: 12px 5px;
            text-align: center;
            border: 1px solid #374151;
            font-size: 12px;
        }
        .streak-box.claimed {
            border-color: var(--success);
            color: var(--success);
            background: rgba(34, 197, 94, 0.1);
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0b111e;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
