<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanjirul Pay & Mine</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body { background-color: #0f1117; color: #ffffff; font-family: Arial, sans-serif; text-align: center; padding: 15px; margin: 0; }
        .header { margin-top: 20px; }
        h1 { font-size: 22px; margin-bottom: 5px; }
        .balance { font-size: 32px; font-weight: bold; color: #4ade80; margin: 20px 0; }
        .card { background-color: #1e222d; padding: 15px; border-radius: 12px; margin: 10px 0; text-align: left; }
        .card h3 { margin: 0 0 5px 0; font-size: 16px; }
        .card p { margin: 0; color: #94a3b8; font-size: 13px; }
        #ton-connect { display: flex; justify-content: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Tanjirul Pay & Mine 🚀</h1>
        <div class="balance" id="score">0 TPZ</div>
    </div>
    <div id="ton-connect"></div>
    <div class="card">
        <h3>📋 Daily Tasks</h3>
        <p>Complete tasks to earn extra tokens.</p>
    </div>
    <div class="card">
        <h3>👥 Invite Friends</h3>
        <p>Share your referral link and earn bonuses.</p>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/ton-community/ton-connect/main/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });
    </script>
</body>
</html>
