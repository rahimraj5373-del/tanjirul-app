<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanjirul Pay & Mine</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding-top: 30px;
        }
        .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #38bdf8;
        }
        .balance-card {
            background: #1e293b;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .balance {
            font-size: 36px;
            font-weight: bold;
            color: #facc15;
        }
        .mine-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: 0.2s;
            width: 100%;
        }
        .mine-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">⚡</div>
        <h1>Tanjirul Pay & Mine</h1>
        <p>Tap the button below to mine TPZ tokens!</p>

        <div class="balance-card">
            <p style="margin: 0; color: #94a3b8;">Your Balance</p>
            <div class="balance" id="balance">0.00 TPZ</div>
        </div>

        <button class="mine-btn" onclick="mineToken()">⛏️ TAP TO MINE</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let score = 0;
        function mineToken() {
            score += 1;
            document.getElementById('balance').innerText = score.toFixed(2) + ' TPZ';
            
            // Haptic feedback if available
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }
    </script>

</body>
</html>
