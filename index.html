<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanjirul Pay & Mine</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #070913, #111827);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 95px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 15px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #f59e0b, #ec4899);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }
        .balance-card {
            background: linear-gradient(135deg, #1e1b4b, #312e81, #1e1b4b);
            background-size: 200% 200%;
            animation: gradientAnim 6s ease infinite;
            border-radius: 22px;
            padding: 24px;
            text-align: center;
            border: 1px solid rgba(245, 158, 11, 0.4);
            margin-bottom: 18px;
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.3);
        }
        @keyframes gradientAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .balance-amount {
            font-size: 38px;
            font-weight: bold;
            color: #facc15;
            margin: 10px 0;
            text-shadow: 0 0 20px rgba(250, 204, 21, 0.5);
        }
        .card {
            background: linear-gradient(135deg, #131b2e, #1f2937);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 14px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .btn-gold {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            transition: 0.2s;
        }
        .btn-gold:active {
            transform: scale(0.97);
        }
        .btn-sm {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #fff;
            border: none;
            padding: 9px 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }
        .streak-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }
        .streak-box {
            background: #111827;
            border-radius: 12px;
            padding: 12px 5px;
            text-align: center;
            border: 1px solid #374151;
            font-size: 12px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .streak-box.claimed {
            border-color: #22c55e;
            color: #22c55e;
            background: rgba(34, 197, 94, 0.15);
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.2);
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(11, 17, 30, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid rgba(245, 158, 11, 0.3);
            max-width: 480px;
            margin: 0 auto;
            z-index: 1000;
        }
        .nav-item {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 11px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .nav-item.active {
            color: #facc15;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .tab-content.active {
            display: block;
        }
